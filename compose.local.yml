# Disposable local dependencies; no production endpoints or integrations.
name: jaguar-crm-showcase
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: jaguar
      POSTGRES_PASSWORD: local-demo-only
      POSTGRES_DB: jaguar_showcase
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - showcase-postgres:/var/lib/postgresql/data
  redis:
    image: redis:7
    ports:
      - "127.0.0.1:6389:6379"
volumes:
  showcase-postgres:
