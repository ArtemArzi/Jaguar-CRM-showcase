<div id="parent-invite-panel" class="mb-4">
  {% if invite_error %}
  <div role="alert" class="p-4 text-[13px]" style="border: 1.5px solid #C45A3B; color: #C45A3B; background-color: #FFF7F5;">
    {{ invite_error }}
  </div>
  {% elif invite_url %}
  <div data-parent-invite class="p-4 flex flex-col gap-3" style="border: 1.5px solid var(--branding-dark); background-color: #FAFAFA;">
    <div class="flex items-center gap-2">
      <i data-lucide="link" class="w-4 h-4" style="color: var(--branding-dark);"></i>
      <span class="text-[11px] font-semibold tracking-[1px]" style="color: var(--branding-dark);">Ссылка для привязки родителя</span>
    </div>
    <label class="flex flex-col gap-1">
      <span class="text-[12px]" style="color: var(--branding-text-secondary);">
        Скопируйте ссылку родителю. Она привязывает существующий аккаунт и не выдаёт пароль.
      </span>
      <input data-invite-link type="text" readonly value="{{ invite_url }}"
             class="w-full px-3 py-2 text-[12px] outline-none"
             style="border: 1px solid var(--branding-border); color: var(--branding-text);">
    </label>
    <div class="flex flex-col gap-2 sm:flex-row sm:items-center sm:justify-between">
      <span class="text-[12px]" style="color: var(--branding-text-secondary);">
        Токен: <code class="text-[11px]">{{ invite_token }}</code>
      </span>
      <button type="button"
              onclick="navigator.clipboard?.writeText(this.closest('[data-parent-invite]').querySelector('[data-invite-link]').value)"
              class="flex min-h-[44px] items-center justify-center gap-2 px-4 py-2 text-[11px] font-semibold tracking-[1px]"
              style="background-color: var(--branding-dark); color: var(--branding-on-primary);">
        <i data-lucide="copy" class="w-3.5 h-3.5"></i>
        СКОПИРОВАТЬ
      </button>
    </div>
    <span class="text-[12px]" style="color: var(--branding-text-secondary);">
      Действует до {{ expires_at|date:"d.m.Y H:i" }}
    </span>
  </div>
  {% endif %}
</div>
