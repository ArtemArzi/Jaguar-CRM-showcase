<div class="p-6">
  <div class="flex items-center justify-between mb-6">
    <h2 class="text-[18px] font-bold tracking-[1px]" style="color: var(--branding-text);">НОВЫЙ УЧЕНИК</h2>
    <button type="button"
            onclick="document.getElementById('slide-over-backdrop').classList.add('hidden'); document.getElementById('slide-over').classList.add('translate-x-full');"
            class="w-8 h-8 flex items-center justify-center rounded"
            style="color: var(--branding-text-secondary);">
      <i data-lucide="x" class="w-5 h-5"></i>
    </button>
  </div>

  {% if error %}
  <div class="mb-4 p-3 text-[13px]" style="background-color: #FEE2E2; color: #991B1B;">{{ error }}</div>
  {% endif %}
  {% if success %}
  <div class="mb-4 p-3 text-[13px]" style="background-color: #D1FAE5; color: #065F46;">{{ success }}</div>
  {% endif %}

  <form hx-post="/dashboard/students/create/" hx-target="#slide-over" hx-swap="innerHTML">
    {% csrf_token %}

    <div class="space-y-4 mb-6">
      <div>
        <label class="block text-[11px] font-semibold tracking-[1px] mb-1" style="color: var(--branding-text-secondary);">ИМЯ *</label>
        <input type="text" name="first_name" value="{{ form_data.first_name|default:'' }}" required
               class="w-full h-10 px-3 text-[13px] border-2 bg-transparent outline-none"
               style="border-color: var(--branding-border); color: var(--branding-text);">
      </div>

      <div>
        <label class="block text-[11px] font-semibold tracking-[1px] mb-1" style="color: var(--branding-text-secondary);">ФАМИЛИЯ</label>
        <input type="text" name="last_name" value="{{ form_data.last_name|default:'' }}" placeholder="Можно добавить позже"
               class="w-full h-10 px-3 text-[13px] border-2 bg-transparent outline-none"
               style="border-color: var(--branding-border); color: var(--branding-text);">
      </div>

      <div>
        <label class="block text-[11px] font-semibold tracking-[1px] mb-1" style="color: var(--branding-text-secondary);">ТЕЛЕФОН *</label>
        <input type="tel" name="phone" value="{{ form_data.phone|default:'' }}" required
               placeholder="+7 911 123-45-67"
               class="w-full h-10 px-3 text-[13px] border-2 bg-transparent outline-none"
               style="border-color: var(--branding-border); color: var(--branding-text);">
        <span class="text-[10px] mt-0.5 block" style="color: var(--branding-text-secondary);">11-15 цифр (например +79031234567)</span>
      </div>

      <div>
        <label class="block text-[11px] font-semibold tracking-[1px] mb-1" style="color: var(--branding-text-secondary);">ИСТОЧНИК</label>
        <select name="source"
                class="w-full h-10 px-3 text-[13px] border-2 bg-transparent outline-none"
                style="border-color: var(--branding-border); color: var(--branding-text);">
          {% for value, label in sources %}
          <option value="{{ value }}">{{ label }}</option>
          {% endfor %}
        </select>
      </div>

      <!-- Комментарий -->
      <div>
        <label class="block text-[11px] font-semibold tracking-[1px] mb-1" style="color: var(--branding-text-secondary);">КОММЕНТАРИЙ</label>
        <textarea name="note" rows="2" placeholder="Откуда узнал, что интересует..."
                  class="w-full px-3 py-2 text-[13px] border-2 bg-transparent outline-none resize-none"
                  style="border-color: var(--branding-border); color: var(--branding-text);">{{ form_data.note|default:'' }}</textarea>
      </div>

      <!-- Ребёнок -->
      <label class="flex items-center gap-3 cursor-pointer py-2">
        <input type="checkbox" name="is_child" value="1"
               class="w-4 h-4" style="accent-color: var(--branding-primary);">
        <div>
          <span class="text-[13px] block" style="color: var(--branding-text);">Ребёнок</span>
          <span class="text-[11px]" style="color: var(--branding-text-secondary);">Несовершеннолетний ученик</span>
        </div>
      </label>
    </div>

    <p class="text-[11px] mb-4" style="color: var(--branding-text-secondary);">
      Ученик будет создан со статусом <strong>Лид</strong>
    </p>

    <button type="submit"
            class="w-full h-11 text-[11px] font-semibold tracking-[1px]"
            style="background-color: var(--branding-primary); color: var(--branding-on-primary);">
      СОЗДАТЬ УЧЕНИКА
    </button>
  </form>
</div>
