<div class="p-7">
  <div class="flex items-center justify-between mb-4">
    <span class="text-[12px]" style="color: var(--branding-text-secondary);">
      Редактирование / {{ student.first_name }} {{ student.last_name }}
    </span>
    <button onclick="document.getElementById('slide-over-backdrop').classList.add('hidden'); document.getElementById('slide-over').classList.add('translate-x-full');"
            class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-black/5">
      <i data-lucide="x" class="w-5 h-5" style="color: var(--branding-text-secondary);"></i>
    </button>
  </div>

  <h2 class="text-[20px] font-bold tracking-[0.5px] mb-6" style="color: var(--branding-text);">РЕДАКТИРОВАТЬ УЧЕНИКА</h2>

  {% if errors %}
  <div class="mb-4 p-3 text-[13px]" style="background-color: #FDF2EF; border: 1px solid #C45A3B; color: #C45A3B;">
    {% for error in errors %}
    <div>{{ error }}</div>
    {% endfor %}
  </div>
  {% endif %}

  <form hx-post="/dashboard/students/{{ student.id }}/edit/" hx-target="#slide-over">
    {% csrf_token %}

    <div class="flex flex-col gap-4 mb-6">
      <div>
        <label class="block text-[11px] font-semibold tracking-[1px] mb-1.5" style="color: #888888;">ИМЯ</label>
        <input type="text" name="first_name" value="{{ student.first_name }}" required
               class="w-full h-10 px-4 text-[13px] outline-none"
               style="border: 1.5px solid var(--branding-border); color: var(--branding-text);" />
      </div>
      <div>
        <label class="block text-[11px] font-semibold tracking-[1px] mb-1.5" style="color: #888888;">ФАМИЛИЯ</label>
        <input type="text" name="last_name" value="{{ student.last_name }}" required
               class="w-full h-10 px-4 text-[13px] outline-none"
               style="border: 1.5px solid var(--branding-border); color: var(--branding-text);" />
      </div>
      <div>
        {% if student.is_child %}
        <label class="block text-[11px] font-semibold tracking-[1px] mb-1.5" style="color: #888888;">ТЕЛЕФОН РОДИТЕЛЯ</label>
        <input type="tel" name="guardian_phone" value="{{ student.guardian_phone }}" required
               pattern="\+?\d{10,15}"
               title="10-15 цифр, можно с +"
               class="w-full h-10 px-4 text-[13px] outline-none"
               style="border: 1.5px solid var(--branding-border); color: var(--branding-text);" />
        {% else %}
        <label class="block text-[11px] font-semibold tracking-[1px] mb-1.5" style="color: #888888;">ТЕЛЕФОН</label>
        <input type="tel" name="phone" value="{{ student.phone }}" required
               pattern="\+?\d{10,15}"
               title="10-15 цифр, можно с +"
               class="w-full h-10 px-4 text-[13px] outline-none"
               style="border: 1.5px solid var(--branding-border); color: var(--branding-text);" />
        {% endif %}
        <span class="text-[11px] mt-0.5 block" style="color: #888888;">Формат: +79001234567</span>
      </div>
      <div>
        <label class="block text-[11px] font-semibold tracking-[1px] mb-1.5" style="color: #888888;">EMAIL</label>
        <input type="email" name="email" value="{{ student.email }}"
               class="w-full h-10 px-4 text-[13px] outline-none"
               style="border: 1.5px solid var(--branding-border); color: var(--branding-text);" />
      </div>
      <div>
        <label class="block text-[11px] font-semibold tracking-[1px] mb-1.5" style="color: #888888;">ИСТОЧНИК</label>
        <div class="relative">
          <select name="source" class="w-full h-10 px-4 text-[13px] outline-none appearance-none"
                  style="border: 1.5px solid var(--branding-border); color: var(--branding-text);">
            {% for value, label in sources %}
            <option value="{{ value }}" {% if student.source == value %}selected{% endif %}>{{ label }}</option>
            {% endfor %}
          </select>
          <i data-lucide="chevron-down" class="absolute right-3 top-1/2 -translate-y-1/2 w-4 h-4 pointer-events-none" style="color: #888888;"></i>
        </div>
      </div>
      <div>
        <label class="block text-[11px] font-semibold tracking-[1px] mb-1.5" style="color: #888888;">ПРОТИВОПОКАЗАНИЯ</label>
        <textarea name="contraindications" rows="3"
                  class="w-full px-4 py-3 text-[13px] outline-none resize-none"
                  style="border: 1.5px solid var(--branding-border); color: var(--branding-text);">{{ student.contraindications }}</textarea>
      </div>
    </div>

    <div class="flex gap-3">
      <button type="submit" class="flex-1 h-10 text-[11px] font-semibold tracking-[1px]"
              style="background-color: var(--branding-dark); color: var(--branding-on-primary);">
        СОХРАНИТЬ
      </button>
      <button type="button"
              hx-get="/dashboard/students/{{ student.id }}/card/"
              hx-target="#slide-over"
              class="flex-1 h-10 text-[11px] font-semibold tracking-[1px]"
              style="border: 1.5px solid var(--branding-border); color: var(--branding-text);">
        ОТМЕНА
      </button>
    </div>
  </form>
</div>
