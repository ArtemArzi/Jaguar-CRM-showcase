<div class="space-y-6" data-onboarding-draft-id="{{ draft.id }}" x-data="{ rows: JSON.parse('{{ rows_json|escapejs }}') }">
  <div>
    <h3 class="text-lg font-semibold">Шаг 5: Тарифы</h3>
    <p class="text-sm text-gray-500 mt-1">Настройте тарифы абонементов для вашего клуба.</p>
  </div>

  <form
    hx-post="/dashboard/onboarding/step/5/"
    hx-target="#wizard-content"
    class="space-y-4"
  >
    {% csrf_token %}

    <div class="space-y-3">
      <div class="hidden sm:grid grid-cols-12 gap-2 text-xs font-medium text-gray-500">
        <div class="col-span-4">Название тарифа</div>
        <div class="col-span-2">Цена</div>
        <div class="col-span-3">Кол-во занятий</div>
        <div class="col-span-3">Срок (дней)</div>
      </div>

      <template x-for="(row, idx) in rows" :key="idx">
        <div class="grid grid-cols-1 sm:grid-cols-12 gap-2 p-3 sm:p-0 border sm:border-0 rounded">
          <input type="text" x-model="row.name" :name="'tariffs[' + idx + '].name'" placeholder="напр. Месячный" class="sm:col-span-4 border rounded px-2 py-1.5 text-sm">
          <input type="number" x-model="row.price" :name="'tariffs[' + idx + '].price'" placeholder="Цена, 5000" min="1" class="sm:col-span-2 border rounded px-2 py-1.5 text-sm">
          <input type="number" x-model="row.training_limit" :name="'tariffs[' + idx + '].training_limit'" placeholder="Кол-во занятий (безлимит)" min="1" class="sm:col-span-3 border rounded px-2 py-1.5 text-sm">
          <input type="number" x-model="row.duration_days" :name="'tariffs[' + idx + '].duration_days'" placeholder="Срок, дней (30)" min="1" class="sm:col-span-3 border rounded px-2 py-1.5 text-sm">
        </div>
      </template>
    </div>

    <button
      type="button"
      @click="rows.push({ name: '', price: '', training_limit: '', duration_days: '30' })"
      class="text-sm text-blue-600 hover:text-blue-800"
    >+ Добавить ещё тариф</button>

    {% if error %}
    <div class="text-sm text-red-600 bg-red-50 p-3 rounded" data-error-code="{{ error_code }}">{{ error }}</div>
    {% endif %}

    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 pt-4">
      <button
        type="button"
        hx-post="/dashboard/onboarding/skip/5/"
        hx-target="#wizard-content"
        class="text-sm text-gray-500 hover:text-gray-700"
      >Пропустить</button>
      <button
        type="submit"
        class="px-6 py-2 text-white text-sm font-semibold tracking-[1px]"
        style="background-color: var(--branding-accent, #22c55e)"
      >Завершить настройку</button>
    </div>
  </form>
</div>
