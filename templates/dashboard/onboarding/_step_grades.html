<div class="space-y-6" data-onboarding-draft-id="{{ draft.id }}">
  <div>
    <h3 class="text-lg font-semibold">Шаг 1: Грейды и дисциплины</h3>
    <p class="text-sm text-gray-500 mt-1">Выберите дисциплины единоборств для вашего клуба. Шаблоны грейдов создадутся автоматически.</p>
  </div>

  <form
    hx-post="/dashboard/onboarding/step/1/"
    hx-target="#wizard-content"
    class="space-y-4"
  >
    {% csrf_token %}

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-2">Дисциплины</label>
      <div class="space-y-2">
        {% for disc in "bjj,karate,boxing,mma,taekwondo"|make_list %}{% endfor %}
        <label class="flex items-center gap-2">
          <input type="checkbox" name="disciplines" value="bjj" class="rounded" {% if step_data.disciplines %}{% for d in step_data.disciplines %}{% if d == "bjj" %}checked{% endif %}{% endfor %}{% endif %}>
          <span>Бразильское джиу-джитсу</span>
        </label>
        <label class="flex items-center gap-2">
          <input type="checkbox" name="disciplines" value="karate" class="rounded" {% if step_data.disciplines %}{% for d in step_data.disciplines %}{% if d == "karate" %}checked{% endif %}{% endfor %}{% endif %}>
          <span>Каратэ</span>
        </label>
        <label class="flex items-center gap-2">
          <input type="checkbox" name="disciplines" value="boxing" class="rounded" {% if step_data.disciplines %}{% for d in step_data.disciplines %}{% if d == "boxing" %}checked{% endif %}{% endfor %}{% endif %}>
          <span>Бокс</span>
        </label>
        <label class="flex items-center gap-2">
          <input type="checkbox" name="disciplines" value="mma" class="rounded" {% if step_data.disciplines %}{% for d in step_data.disciplines %}{% if d == "mma" %}checked{% endif %}{% endfor %}{% endif %}>
          <span>ММА</span>
        </label>
        <label class="flex items-center gap-2">
          <input type="checkbox" name="disciplines" value="taekwondo" class="rounded" {% if step_data.disciplines %}{% for d in step_data.disciplines %}{% if d == "taekwondo" %}checked{% endif %}{% endfor %}{% endif %}>
          <span>Тхэквондо</span>
        </label>
      </div>
    </div>

    <div>
      <label class="flex items-center gap-2">
        <input type="checkbox" name="use_templates" value="true" checked class="rounded">
        <span class="text-sm text-gray-700">Использовать готовые шаблоны грейдов</span>
      </label>
    </div>

    {% if error %}
    <div class="text-sm text-red-600 bg-red-50 p-3 rounded" data-error-code="{{ error_code }}">{{ error }}</div>
    {% endif %}

    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 pt-4">
      <button
        type="button"
        hx-post="/dashboard/onboarding/skip/1/"
        hx-target="#wizard-content"
        class="text-sm text-gray-500 hover:text-gray-700"
      >Пропустить</button>
      <button
        type="submit"
        class="px-6 py-2 text-white text-sm font-semibold tracking-[1px]"
        style="background-color: var(--branding-accent, #22c55e)"
      >Далее</button>
    </div>
  </form>
</div>
