<div class="p-6">
  <div class="flex items-center justify-between mb-6">
    <h2 class="text-[18px] font-bold tracking-[1px]" style="color: var(--branding-text);">
      {% if location %}РЕДАКТИРОВАТЬ ЗАЛ{% else %}НОВЫЙ ЗАЛ{% endif %}
    </h2>
    <button type="button"
            onclick="document.getElementById('slide-over-backdrop').classList.add('hidden'); document.getElementById('slide-over').classList.add('translate-x-full');"
            class="w-8 h-8 flex items-center justify-center rounded"
            style="color: var(--branding-text-secondary);">
      <i data-lucide="x" class="w-5 h-5"></i>
    </button>
  </div>

  {% if error %}
  <div class="mb-4 p-3 text-[13px]" style="background-color: #FEE2E2; color: #991B1B;">{{ error }}</div>
  {% endif %}

  <form hx-post="{% if location %}{% url 'location-edit' location.id %}{% else %}{% url 'location-form' %}{% endif %}"
        hx-target="#slide-over" hx-swap="innerHTML">
    {% csrf_token %}

    <div class="space-y-4 mb-6">
      <div>
        <label class="block text-[11px] font-semibold tracking-[1px] mb-1" style="color: var(--branding-text-secondary);">НАЗВАНИЕ *</label>
        <input type="text" name="name" value="{{ location.name|default:'' }}" required
               class="w-full h-10 px-3 text-[13px] border-2 bg-transparent outline-none"
               style="border-color: var(--branding-border); color: var(--branding-text);">
      </div>

      <div>
        <label class="block text-[11px] font-semibold tracking-[1px] mb-1" style="color: var(--branding-text-secondary);">АДРЕС</label>
        <textarea name="address" rows="3" placeholder="Например: ул. Ленина 15, 2 этаж"
                  class="w-full px-3 py-2 text-[13px] border-2 bg-transparent outline-none resize-none"
                  style="border-color: var(--branding-border); color: var(--branding-text);">{{ location.address|default:'' }}</textarea>
      </div>
    </div>

    <button type="submit"
            class="w-full h-11 text-[11px] font-semibold tracking-[1px]"
            style="background-color: var(--branding-primary); color: var(--branding-on-primary);">
      {% if location %}СОХРАНИТЬ{% else %}СОЗДАТЬ ЗАЛ{% endif %}
    </button>
  </form>
</div>
